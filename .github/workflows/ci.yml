name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint all shell scripts
        # Warning severity: info/style notes (e.g. SC2012) don't fail the build,
        # but real robustness issues do.
        run: |
          shopt -s globstar
          shellcheck --severity=warning skills/**/generate.sh tests/mock_bin/*

  bats:
    name: bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bats
        run: npm install -g bats
      - name: Run test suite
        run: bats tests/
